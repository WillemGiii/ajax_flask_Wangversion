<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax_Flask 專案</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>

    </style>
</head>

<body>
    {% include '_navbar.html' %}
    <div class="container">


        <div class="container mt-5">

            <h2 class="display-6 fw-bold text-secondary mb-4 pb-2 border-bottom">
                <i class="bi bi-image-fill me-2"></i>api 回傳文字、圖片及JSON，fetch 如何接收資料
            </h2>
            <h3 class="fw-bold text-secondary my-4 pb-2 border-bottom">
                文字處理
            </h3>
            <button id="buttonText" class="btn btn-primary">讀取文字</button>

            <h3 class="fw-bold text-secondary my-4 pb-2 border-bottom">
                圖處理
            </h3>
            <button id="buttonLoad" class="btn btn-primary">讀取圖片</button>
            <h3 class="fw-bold text-secondary my-4 pb-2 border-bottom">
                JSON處理
            </h3>
            <button id="buttonJson" class="btn btn-primary">讀取JSON</button>
            <div class="mt-3">
                <img id="img1" class="img-fluid rounded border shadow-sm" style="width: 300px; height: auto;"
                    src="static/images/empty.png" />
            </div>
            <div id="divInfo" class="alert alert-info my-4">
            </div>
            <select id="select-task">
                <option value="1"> Willem</option>
                <option value="2"> 該減肥</option>
            </select>


        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const btnText = document.querySelector('#buttonText');
        const btnLoad = document.querySelector('#buttonLoad');
        const btnJson = document.querySelector('#buttonJson');
        const divInfo = document.querySelector('#divInfo');
        const theImg = document.querySelector('#img1');
        const selectTask = document.querySelector('#select-task');


        btnText.addEventListener('click', async () => {
            const response = await fetch("api/text");
            //使用 response.text() 取得字串
            const data = await response.text();

            divInfo.textContent = data;

        });

        btnLoad.addEventListener('click', async () => {
            const response = await fetch("api/image");
            // 如果 api 回傳的是圖片，那我們可以透過 blob() 從 Response Body 取出圖片
            const datas = await response.blob(); 
            // 使用 URL.createObjectURL() 建立物件網址
            const imageUrl = URL.createObjectURL(datas);
            theImg.src = imageUrl;

        })


        btnJson.addEventListener('click', async () => {
            const response = await fetch("api/json");
            // api 回傳的是 JSON，透過 json() 從 Response Body 取出JSON
            const datas = await response.json();
            divInfo.textContent = JSON.stringify(datas);
            const tasks = datas.map((task)=>{
                return `<option value="${task.id}">${task.task} </option>`;
             });
            selectTask.innerHTML = tasks.join("");

        });

        //[{"id":1,"task":"學習 Flask-RESTful","completed":true},
        // {"id":2,"task":"撰寫 AJAX fetch 練習","completed":false},
        // {"id":3,"task":"實作圖片上傳功能","completed":false}]

        //['<option value=1> 學習 Flask-RESTful </option>', '<option value=2> 撰寫 AJAX fetch 練習 </option>', ...
        //


        theImg.onload = () => {
            // 當圖片真的出現在畫面上後，這個暫存網址就可以作廢了，節省記憶體
            URL.revokeObjectURL(theImg.src);
        };


    </script>
</body>

</html>
