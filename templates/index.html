            <button id="buttonEnd" class="btn btn-primary">Ajax 結束</button>
            <img id="img1" src="static/images/Loading.gif" style="display: none;" alt="載入中..." />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 第一步 : 找到要操作的元素
        const divInfo = document.querySelector('#divInfo');
        const imgLoader = document.querySelector('#img1');

        const buttonStart = document.querySelector('#buttonStart')
        const buttonEnd = document.querySelector('#buttonEnd')
        
        const apiUrl = '/api/hello'

        // 建立 abortController 物件
        // 放在宣告變數那邊
        let abortController = null;

        // 步驟二 甚麼時候做? 按下按鈕 => click
        buttonStart.addEventListener('click', async () => {
            // 步驟三 做甚麼?
            try {

                // 建立 abortController 物件
                abortController = new AbortController();

                // 從 AbortController 取得 signal 屬性
                const signal = abortController.signal;


                imgLoader.style.display = 'inline'; //顯示執行中的圖示
                buttonStart.disabled = true; // 停用按鈕功能

                // 可能發生例外的程式
                const response = await fetch(apiUrl, {signal: signal}); //Response 物件 => header + body
                
                if (!response.ok){
                    throw new Error(`API 呼叫失敗，狀態碼:${response.status}`);
                }

                const data = await response.json(); // 從 Response Body 取出 JSON 格式的資料
                divInfo.innerHTML = `<h2>${data.message}</h2>`


            } catch(error){
                // 處理例外
                let message = error.message;

                if (error.name == 'AbortError' ){
                    message = "您已取消此次請求!";
                }

                divInfo.textContent = message;

            } finally {
                // 最後的收尾工作
                console.log("請求處理結束");
                imgLoader.style.display = 'none'; // 隱藏執行中的圖示
                buttonStart.disabled = false; // 啟用按鈕功能
            }
        });

        // 結束請求：獨立註冊，不要放在開始按鈕的事件裡
        buttonEnd.addEventListener('click', () => {
            if(abortController){
                abortController.abort();
            }
